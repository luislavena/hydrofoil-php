name: CI

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      version:
        description: 'PHP version to build (e.g., 8.4) or "all" for all versions'
        required: false
        default: 'all'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed docker directories
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            docker:
              - 'docker/**'

      - name: Generate build matrix
        id: set-matrix
        run: |
          VERSIONS_FILE=".github/versions.json"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger - build specified version or all
            INPUT_VERSION="${{ github.event.inputs.version }}"
            if [[ "$INPUT_VERSION" == "all" || -z "$INPUT_VERSION" ]]; then
              CHANGED_DIRS=$(jq -r 'keys[]' "$VERSIONS_FILE")
            else
              CHANGED_DIRS="$INPUT_VERSION"
            fi
          else
            # Automatic trigger - only changed directories
            CHANGED_FILES='${{ steps.filter.outputs.docker_files }}'
            if [[ "$CHANGED_FILES" == "[]" || -z "$CHANGED_FILES" ]]; then
              echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
              echo "has_changes=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            CHANGED_DIRS=$(echo "$CHANGED_FILES" | jq -r '.[]' | sed -n 's|^docker/\([^/]*\)/.*|\1|p' | sort -u)
          fi

          # Build matrix from changed directories
          MATRIX_INCLUDE="[]"
          for DIR in $CHANGED_DIRS; do
            if jq -e --arg v "$DIR" '.[$v]' "$VERSIONS_FILE" > /dev/null 2>&1; then
              # Versions with a test folder get tested before they publish
              HAS_TESTS=false
              if [[ -d "docker/$DIR/test" ]]; then
                HAS_TESTS=true
              fi
              ENTRY=$(jq -c --arg v "$DIR" --argjson t "$HAS_TESTS" '{
                php_major_minor: $v,
                php_full: .[$v].php_full,
                base_distro: .[$v].base_distro,
                has_tests: $t,
                concurrency_group: "build-php"
              }' "$VERSIONS_FILE")
              MATRIX_INCLUDE=$(echo "$MATRIX_INCLUDE" | jq -c --argjson e "$ENTRY" '. + [$e]')
            fi
          done

          echo "matrix={\"include\":$MATRIX_INCLUDE}" >> $GITHUB_OUTPUT
          if [[ "$MATRIX_INCLUDE" == "[]" ]]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  image:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    name: >-
      PHP ${{ matrix.php_full }} (${{ matrix.php_major_minor }})

    permissions:
      contents: read
      packages: write
      id-token: write

    concurrency:
      group: ${{ matrix.concurrency_group || format('{0}-{1}', github.run_id, matrix.php_full) }}

    uses: ./.github/workflows/image.yml
    with:
      php_major_minor: ${{ matrix.php_major_minor }}
      php_full: ${{ matrix.php_full }}
      base_distro: ${{ matrix.base_distro }}
      has_tests: ${{ matrix.has_tests }}
    secrets: inherit
